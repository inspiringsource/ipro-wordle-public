name: Publish package to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Create Maven settings.xml for GitHub Packages
        shell: bash
        env:
          GH_ACTOR: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "::add-mask::${GH_TOKEN}"
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          chmod 600 ~/.m2/settings.xml

      - name: Publish
        env:
          GH_ACTOR: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          mvn -B -s ~/.m2/settings.xml -DskipTests \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/inspiringsource/ipro-wordle-public \
            deploy